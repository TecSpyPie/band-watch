name: Suggest an idea
description: A feature or change you'd like in HamShack.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like HamShack to do?
      description: Describe it as you'd use it on the air.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: input
    id: like
    attributes:
      label: Is there another program that does this well?
      description: e.g. WSJT-X, Log4OM, MMSSTV, fldigi (so we can see the idea, not copy it).
