<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decodes · HamShack by M0GLP &amp; M3VRV</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=1.44.1">
<link rel="stylesheet" href="/listen.css?v=1.44.1">
<style>
  body{margin:0}
  .dw{padding:12px 16px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box}
  .dw header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .dw h1{font:700 1.375rem "Barlow Condensed",sans-serif;margin:0}
  .dw .dcwrap{flex:1;max-height:none}
  .dw input[type=search]{min-width:160px}
</style>
</head>
<body>
<div class="dw">
  <header>
    <h1>Decodes</h1>
    <span class="small muted" id="dwStatus">Waiting for HamShack…</span>
    <label class="small dcchk"><input type="checkbox" id="dwCq"> CQ only</label>
    <input type="search" id="dwFind" placeholder="Find a callsign" aria-label="Find a callsign" autocomplete="off">
    <button type="button" class="ghost" id="dwClear">Clear</button>
    <span class="dcclock" id="dwClock" aria-live="off"></span>
    <details class="dccols">
      <summary class="small">Columns and time zone</summary>
      <div class="dccolsbox" id="dwColsBox"></div>
    </details>
  </header>
  <div class="dcwrap">
    <pre class="dccwtext" id="dwCw" hidden aria-live="polite"></pre>
    <table class="dctab" id="dwTab">
      <colgroup id="dwCols"></colgroup>
      <thead id="dwHead"></thead>
      <tbody id="dwRows"></tbody>
    </table>
  </div>
</div>
<script src="/js/dcwording.js?v=1.44.1"></script>
<script src="/js/dccols.js?v=1.44.1"></script>
<script src="/js/decodes-page.js?v=1.44.1"></script>
</body>
</html>
